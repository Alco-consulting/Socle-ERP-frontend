@if (loadError(); as failure) {
  <alco-error-state
    [title]="failure.title"
    [message]="failure.message"
    [code]="failure.code"
    [correlationId]="failure.correlationId ?? ''"
  />
  <div class="center">
    <a alcoButton icon="arrow-left" routerLink="/app/comptabilite/tresorerie/comptes">
      Retour aux comptes
    </a>
  </div>
} @else if (!ready()) {
  <alco-loading [rows]="6" label="Chargement du compte…" />
} @else {
  <alco-page-header
    [title]="isNew ? 'Nouveau compte de trésorerie' : 'Modifier ' + (account()?.name ?? '')"
    [subtitle]="isNew ? 'Banque, caisse ou autre compte de trésorerie' : (account()?.code ?? '')"
  >
    <div alcoPageActions>
      <button alcoButton type="button" variant="ghost" (click)="cancel()">Annuler</button>
      <button
        alcoButton
        type="submit"
        form="treasury-account-form"
        variant="primary"
        [loading]="saving()"
        loadingLabel="Enregistrement…"
      >
        Enregistrer
      </button>
    </div>
  </alco-page-header>

  @if (error(); as failure) {
    <alco-error-state
      [inline]="true"
      [title]="failure.title"
      [message]="failure.message"
      [code]="failure.code"
      [correlationId]="failure.correlationId ?? ''"
    />
  }
  @if (invalidSubmit() && form.invalid) {
    <alco-error-state
      [inline]="true"
      title="Certaines informations sont manquantes ou incorrectes."
      message="Corrigez les champs signalés, puis enregistrez à nouveau."
    />
  }

  <form id="treasury-account-form" class="sheet" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <section class="section" aria-labelledby="general-title">
      <h2 id="general-title" class="alco-section-title">Informations générales</h2>
      <div class="alco-form-grid">
        <alco-form-field label="Code" [required]="true" hint="Unique dans la société.">
          <input alcoInput formControlName="code" maxlength="32" autocomplete="off" />
        </alco-form-field>
        <alco-form-field label="Libellé" [required]="true">
          <input alcoInput formControlName="name" maxlength="100" />
        </alco-form-field>
        <alco-form-field label="Type" [required]="true">
          <select alcoSelect formControlName="account_type">
            <option value="" disabled>Choisir un type</option>
            @for (item of types; track item.id) {
              <option [value]="item.id">{{ item.label }}</option>
            }
          </select>
        </alco-form-field>
        <alco-form-field label="Devise" [required]="true">
          <select alcoSelect formControlName="currency">
            <option value="" disabled>Choisir une devise</option>
            @for (currency of currencyOptions(); track currency.code) {
              <option [value]="currency.code">{{ currency.code }} — {{ currency.name }}</option>
            }
          </select>
        </alco-form-field>
        <alco-form-field
          label="Solde d’ouverture"
          hint="Vide : celui du serveur. Il ne change plus une fois des opérations comptées."
        >
          <input
            alcoInput
            formControlName="opening_balance"
            inputmode="decimal"
            autocomplete="off"
          />
        </alco-form-field>
      </div>
    </section>

    <section class="section" aria-labelledby="posting-title">
      <h2 id="posting-title" class="alco-section-title">Comptabilisation</h2>
      <div class="alco-form-grid">
        <alco-form-field
          label="Compte comptable"
          hint="Code exact du compte du plan comptable (ex. 521100)"
        >
          <input alcoInput formControlName="ledger_account" maxlength="32" autocomplete="off" />
        </alco-form-field>
        <alco-form-field label="Journal par défaut" hint="Code exact du journal (ex. BQ1)">
          <input alcoInput formControlName="journal" maxlength="32" autocomplete="off" />
        </alco-form-field>
      </div>
    </section>

    <section class="section" aria-labelledby="bank-title">
      <h2 id="bank-title" class="alco-section-title">Coordonnées bancaires</h2>
      <div class="alco-form-grid">
        <alco-form-field label="Banque">
          <input alcoInput formControlName="bank_name" maxlength="100" />
        </alco-form-field>
        <alco-form-field label="Agence">
          <input alcoInput formControlName="bank_branch" maxlength="100" />
        </alco-form-field>
        <alco-form-field label="Numéro de compte">
          <input alcoInput formControlName="account_number" maxlength="64" autocomplete="off" />
        </alco-form-field>
        <alco-form-field label="IBAN">
          <input alcoInput formControlName="iban" maxlength="64" autocomplete="off" />
        </alco-form-field>
        <alco-form-field label="BIC">
          <input alcoInput formControlName="bic" maxlength="32" autocomplete="off" />
        </alco-form-field>
      </div>
    </section>
  </form>
}
