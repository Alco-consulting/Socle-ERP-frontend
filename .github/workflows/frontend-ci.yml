name: Frontend CI

# Not on a push for the moment (decision of 2026-10-13, Actions minutes): run it from
# Actions › Frontend CI › Run workflow.
on:
  pull_request:
  # The tests (unit, end-to-end) run on demand only: Actions › Frontend CI › Run workflow.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "24"
  NG_CLI_ANALYTICS: "false"

jobs:
  quality:
    name: Lint, production build (unit tests on demand)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Not run automatically (decision of 2026-10-09): on demand only.
      - run: npm test
        if: github.event_name == 'workflow_dispatch'
      - run: npm run build

  e2e:
    name: End-to-end (journeys, layout ×3 viewports, accessibility, API session)
    # Not run automatically (decision of 2026-10-09): on demand only, Actions › Run workflow.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # No test reaches the real API: in API mode the network is answered by the tests.
      - run: npm run e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report
            e2e/.results
          retention-days: 7
