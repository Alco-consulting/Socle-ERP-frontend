@if (loadError(); as failure) {
  <alco-error-state
    [title]="failure.title"
    [message]="failure.message"
    [code]="failure.code"
    [correlationId]="failure.correlationId ?? ''"
  />
} @else if (!ready()) {
  <alco-loading [rows]="6" label="Chargement de l’immobilisation…" />
} @else {
  <alco-page-header [title]="title()" subtitle="Immobilisation" [dirty]="form.dirty">
    <div alcoPageActions>
      <button
        alcoButton
        type="submit"
        form="asset-form"
        variant="primary"
        [loading]="saving()"
        loadingLabel="Enregistrement…"
      >
        Enregistrer
      </button>
    </div>
  </alco-page-header>

  @if (error(); as failure) {
    <alco-error-state
      [inline]="true"
      [title]="failure.title"
      [message]="failure.message"
      [code]="failure.code"
      [correlationId]="failure.correlationId ?? ''"
    />
  }

  <form id="asset-form" class="sheet" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <section class="alco-form-section" aria-labelledby="asset-title">
      <div class="alco-form-section__intro">
        <h2 id="asset-title" class="alco-section-title">Bien</h2>
        <p>
          Enregistré en brouillon. « Confirmer », sur sa fiche, calcule son tableau d’amortissement.
        </p>
      </div>
      <div class="grid">
        <alco-form-field label="Nom" [required]="true" class="wide">
          <input alcoInput formControlName="name" maxlength="255" autocomplete="off" />
        </alco-form-field>
        <alco-form-field label="Catégorie" [required]="true" hint="Donne les comptes et la durée.">
          <select alcoSelect formControlName="category">
            <option value="" disabled>Choisir…</option>
            @for (category of categories(); track category.public_id) {
              <option [value]="category.public_id">{{ category.name }}</option>
            }
          </select>
        </alco-form-field>
        <alco-form-field label="Date d’acquisition" [required]="true">
          <input alcoInput type="date" formControlName="acquisition_date" />
        </alco-form-field>
        <alco-form-field label="Valeur d’acquisition HT" [required]="true">
          <input alcoInput inputmode="decimal" formControlName="gross_value" autocomplete="off" />
        </alco-form-field>
        <alco-form-field
          label="Durée d’amortissement (mois)"
          [required]="true"
          hint="Celle de la catégorie, sauf si ce bien en a une autre."
        >
          <input alcoInput type="number" min="1" step="1" formControlName="duration_months" />
        </alco-form-field>
        <alco-form-field label="Fournisseur" [optional]="true">
          <alco-autocomplete
            formControlName="partner"
            [search]="searchPartners"
            placeholder="Aucun"
            emptyText="Aucun contact ne correspond."
          />
        </alco-form-field>
        <alco-form-field label="Référence" [optional]="true" hint="N° de série, de facture…">
          <input alcoInput formControlName="reference" maxlength="64" autocomplete="off" />
        </alco-form-field>
      </div>
    </section>
  </form>
}
