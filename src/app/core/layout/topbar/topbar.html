<header class="bar">
  <div class="start">
    <!-- The logo leads to the applications (no grid of dots). -->
    <a class="brand" [routerLink]="home" aria-label="Toutes les applications — Alco Consulting">
      <alco-logo />
    </a>
    @if (app(); as current) {
      <span class="divider" aria-hidden="true"></span>
      <span class="app-name">
        <span class="app-mark-box" aria-hidden="true">
          <img class="app-mark" [src]="current.image" width="22" height="22" alt="" />
        </span>
        {{ current.label }}
      </span>
    }
  </div>

  <div class="end">
    <button
      type="button"
      class="search-trigger"
      aria-label="Rechercher (Ctrl+K)"
      aria-keyshortcuts="Control+K"
      (click)="palette.open()"
    >
      <alco-icon name="search" [size]="16" />
      <span class="search-text">Rechercher…</span>
      <kbd class="search-kbd">Ctrl K</kbd>
    </button>

    @if (session.activeCompany(); as company) {
      <alco-dropdown
        trigger="topbar"
        mode="single"
        align="end"
        icon="company"
        heading="Société active"
        [items]="companyItems()"
        [ariaLabel]="'Société active : ' + company.name + '. Changer de société'"
        (selected)="onCompanySelected($event)"
      >
        <span class="company">
          <span class="company-name">{{ company.name }}</span>
          @if (!company.active) {
            <span class="company-context">Inactive</span>
          }
        </span>
      </alco-dropdown>
    }

    <alco-dropdown
      trigger="topbar"
      align="end"
      icon="help"
      ariaLabel="Aide"
      [showChevron]="false"
      [items]="helpItems"
      (selected)="onHelpSelected($event)"
    />

    <span class="bell">
      <alco-dropdown
        trigger="topbar"
        align="end"
        icon="bell"
        heading="Notifications"
        [ariaLabel]="unread() > 0 ? 'Notifications, ' + unread() + ' non lues' : 'Notifications'"
        [showChevron]="false"
        [items]="notificationItems()"
        (selected)="onNotificationSelected($event)"
      />
      @if (unread() > 0) {
        <span class="bell-count" aria-hidden="true">{{ unread() }}</span>
      }
    </span>

    @if (session.user(); as user) {
      <alco-dropdown
        trigger="topbar"
        align="end"
        [heading]="user.displayName"
        [subheading]="user.email"
        [ariaLabel]="'Compte de ' + user.displayName"
        [showChevron]="false"
        [items]="userItems()"
        (selected)="onUserSelected($event)"
      >
        <span class="avatar" aria-hidden="true">{{ session.initials() }}</span>
      </alco-dropdown>
    }
  </div>
</header>
