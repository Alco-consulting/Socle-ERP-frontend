@if (loadError(); as failure) {
  <alco-error-state
    [title]="failure.title"
    [message]="failure.message"
    [code]="failure.code"
    [correlationId]="failure.correlationId ?? ''"
  />
} @else if (!ready()) {
  <alco-loading [rows]="5" label="Chargement du type…" />
} @else {
  <alco-page-header [title]="title()" subtitle="Type d’emprunt" [dirty]="form.dirty">
    @if (canSave()) {
      <div alcoPageActions>
        <button
          alcoButton
          type="submit"
          form="loan-type-form"
          variant="primary"
          [loading]="saving()"
          loadingLabel="Enregistrement…"
        >
          Enregistrer
        </button>
      </div>
    }
  </alco-page-header>

  @if (error(); as failure) {
    <alco-error-state
      [inline]="true"
      [title]="failure.title"
      [message]="failure.message"
      [code]="failure.code"
      [correlationId]="failure.correlationId ?? ''"
    />
  }

  <form id="loan-type-form" class="sheet" [formGroup]="form" (ngSubmit)="save()" novalidate>
    <section class="alco-form-section" aria-labelledby="type-title">
      <div class="alco-form-section__intro">
        <h2 id="type-title" class="alco-section-title">Type</h2>
        <p>Le code sert de préfixe au numéro de chaque emprunt (« EMP-000001 »).</p>
      </div>
      <div class="grid">
        <alco-form-field label="Code" [required]="true" hint="Ne change plus après la création.">
          <input alcoInput formControlName="code" maxlength="32" autocomplete="off" />
        </alco-form-field>
        <alco-form-field label="Nom" [required]="true">
          <input alcoInput formControlName="name" maxlength="100" autocomplete="off" />
        </alco-form-field>
        <alco-form-field
          label="Journal"
          hint="Pour les intérêts ajoutés au capital ; les paiements vont dans la banque choisie."
        >
          <select alcoSelect formControlName="journal">
            <option value="">Aucun</option>
            @for (journal of journals(); track journal.public_id) {
              <option [value]="journal.public_id">{{ journal.code }} — {{ journal.name }}</option>
            }
          </select>
        </alco-form-field>
      </div>
    </section>

    <section class="alco-form-section" aria-labelledby="type-accounts-title">
      <div class="alco-form-section__intro">
        <h2 id="type-accounts-title" class="alco-section-title">Comptes</h2>
        <p>Par leur code ou leur nom. Un compte manquant bloque l’écriture qui en a besoin.</p>
      </div>
      <div class="grid">
        <alco-form-field label="Capital emprunté" hint="Ex. 162100.">
          <alco-autocomplete
            formControlName="principal_account"
            [search]="searchAccounts"
            placeholder="Aucun compte"
            emptyText="Aucun compte ne correspond."
          />
        </alco-form-field>
        <alco-form-field label="Intérêts" hint="Ex. 671200.">
          <alco-autocomplete
            formControlName="interest_account"
            [search]="searchAccounts"
            placeholder="Aucun compte"
            emptyText="Aucun compte ne correspond."
          />
        </alco-form-field>
        <alco-form-field label="Frais" hint="Ex. 631000.">
          <alco-autocomplete
            formControlName="fee_account"
            [search]="searchAccounts"
            placeholder="Aucun compte"
            emptyText="Aucun compte ne correspond."
          />
        </alco-form-field>
      </div>
    </section>
  </form>
}
