<alco-page-header title="Nouvel exercice" subtitle="Exercice comptable de la société">
  <div alcoPageActions>
    <button alcoButton type="button" variant="ghost" (click)="cancel()">Annuler</button>
    <button
      alcoButton
      type="submit"
      form="fiscal-year-form"
      variant="primary"
      [loading]="saving()"
      loadingLabel="Création…"
    >
      Créer l’exercice
    </button>
  </div>
</alco-page-header>

@if (error(); as failure) {
  <alco-error-state
    [inline]="true"
    [title]="failure.title"
    [message]="failure.message"
    [code]="failure.code"
    [correlationId]="failure.correlationId ?? ''"
  />
}
@if (invalidSubmit() && form.invalid) {
  <alco-error-state
    [inline]="true"
    title="Certaines informations sont manquantes ou incorrectes."
    message="Corrigez les champs signalés, puis créez l’exercice à nouveau."
  />
}

<form id="fiscal-year-form" class="sheet" [formGroup]="form" (ngSubmit)="save()" novalidate>
  <div class="alco-form-grid">
    <alco-form-field label="Code" [required]="true" hint="Ex. 2026 : unique dans la société.">
      <input alcoInput formControlName="code" maxlength="32" autocomplete="off" />
    </alco-form-field>
    <alco-form-field label="Libellé" [required]="true">
      <input alcoInput formControlName="label" maxlength="100" autocomplete="off" />
    </alco-form-field>
    <alco-form-field label="Début" [required]="true">
      <input alcoDatePicker type="date" formControlName="start_date" />
    </alco-form-field>
    <alco-form-field
      label="Fin"
      [required]="true"
      [error]="form.errors?.['order'] ? 'La fin vient après le début.' : null"
      hint="Douze mois en général : du 1er janvier au 31 décembre."
    >
      <input alcoDatePicker type="date" formControlName="end_date" />
    </alco-form-field>
  </div>
  <p class="note">
    Une période par mois est créée avec l’exercice, ouverte : chaque date de l’exercice a sa
    période, et les écritures peuvent y être saisies et validées.
  </p>
</form>
