<div class="tablist" role="tablist" [attr.aria-label]="label()">
  @for (tab of tabs(); track tab.id; let i = $index) {
    <button
      #tab
      type="button"
      role="tab"
      class="tab"
      [id]="baseId + '-tab-' + tab.id"
      [attr.aria-selected]="tab.id === selected()"
      [attr.aria-controls]="baseId + '-panel-' + tab.id"
      [attr.tabindex]="tab.id === selected() ? 0 : -1"
      (click)="selected.set(tab.id)"
      (keydown)="onKeydown($event, i)"
    >
      {{ tab.label }}
      @if (tab.count !== undefined) {
        <span class="count">{{ tab.count }}</span>
      }
      @if (tab.invalid) {
        <span class="invalid" aria-hidden="true">!</span>
        <span class="alco-sr-only">(à corriger)</span>
      }
    </button>
  }
</div>
@if (activePanel(); as panel) {
  <div
    class="panel"
    role="tabpanel"
    tabindex="0"
    [id]="baseId + '-panel-' + panel.id()"
    [attr.aria-labelledby]="baseId + '-tab-' + panel.id()"
  >
    <ng-container *ngTemplateOutlet="panel.template" />
  </div>
}
